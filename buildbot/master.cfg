"""Top-level pycdc Buildbot master configuration."""

from pathlib import Path
import sys

from buildbot.plugins import util


CONFIG_DIR = Path(__file__).resolve().parent
if str(CONFIG_DIR) not in sys.path:
    sys.path.insert(0, str(CONFIG_DIR))

from builders import create_builders  # noqa: E402
from changesources import create_change_sources  # noqa: E402
from config import (  # noqa: E402
    ADMIN_USERS,
    DATABASE_URL,
    GITHUB_OAUTH_CLIENT_ID,
    GITHUB_OAUTH_CLIENT_SECRET,
    GITHUB_WEBHOOK_SECRET,
    MASTER_FQDN,
    MASTER_TO_WORKER,
    PROJECT_NAME,
)
from reporters import create_reporters  # noqa: E402
from schedulers import create_schedulers  # noqa: E402
from workers import create_workers  # noqa: E402


c = BuildmasterConfig = {}

c["title"] = PROJECT_NAME
c["titleURL"] = MASTER_FQDN
c["buildbotURL"] = f"{MASTER_FQDN.rstrip('/')}/"
c["db"] = {"db_url": DATABASE_URL}
c["workers"] = create_workers()
c["protocols"] = {"pb": {"port": MASTER_TO_WORKER}}
c["change_source"] = create_change_sources()
c["builders"] = create_builders()
builder_names = [builder.name for builder in c["builders"]]
c["schedulers"] = create_schedulers(builder_names)
c["services"] = create_reporters()
c["www"] = {
    "port": "tcp:8010:interface=0.0.0.0",
    "plugins": {
        "waterfall_view": {},
        "console_view": {},
        "grid_view": {},
    },
    "auth": util.GitHubAuth(
        GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET, apiVersion=4
    ),
    "authz": util.Authz(
        allowRules=[util.AnyControlEndpointMatcher(role="ci-admin")],
        roleMatchers=[
            util.RolesFromUsername(roles=["ci-admin"], usernames=ADMIN_USERS)
        ],
    ),
    "change_hook_dialects": {
        "github": {"secret": GITHUB_WEBHOOK_SECRET, "strict": True}
    },
}
c["buildbotNetUsageData"] = None
c["buildCacheSize"] = 1000
c["logCompressionMethod"] = "gz"
c["logCompressionLimit"] = 4 * 1024
c["multiMaster"] = False
