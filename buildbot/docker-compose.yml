services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildbot
      POSTGRES_USER: buildbot
      POSTGRES_PASSWORD: ${BUILDBOT_DB_PASSWORD:?BUILDBOT_DB_PASSWORD must be set}
    volumes:
      - buildbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildbot -d buildbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  master:
    build:
      context: ..
      dockerfile: buildbot/docker/master.Dockerfile
    image: pycdc-buildbot-master:4.2.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYCDC_GIT_URL: ${PYCDC_GIT_URL:?PYCDC_GIT_URL must be set}
      PYCDC_GITHUB_OWNER: ${PYCDC_GITHUB_OWNER:?PYCDC_GITHUB_OWNER must be set}
      PYCDC_GITHUB_REPOSITORY: ${PYCDC_GITHUB_REPOSITORY:?PYCDC_GITHUB_REPOSITORY must be set}
      PYCDC_GITHUB_TOKEN: ${PYCDC_GITHUB_TOKEN:?PYCDC_GITHUB_TOKEN must be set}
      PYCDC_GITHUB_WEBHOOK_SECRET: ${PYCDC_GITHUB_WEBHOOK_SECRET:?PYCDC_GITHUB_WEBHOOK_SECRET must be set}
      BUILDBOT_GITHUB_OAUTH_CLIENT_ID: ${BUILDBOT_GITHUB_OAUTH_CLIENT_ID:?BUILDBOT_GITHUB_OAUTH_CLIENT_ID must be set}
      BUILDBOT_GITHUB_OAUTH_CLIENT_SECRET: ${BUILDBOT_GITHUB_OAUTH_CLIENT_SECRET:?BUILDBOT_GITHUB_OAUTH_CLIENT_SECRET must be set}
      BUILDBOT_ADMIN_USERS: ${BUILDBOT_ADMIN_USERS:?BUILDBOT_ADMIN_USERS must be set}
      BUILDBOT_WORKER_PASSWORD: ${BUILDBOT_WORKER_PASSWORD:?BUILDBOT_WORKER_PASSWORD must be set}
      BUILDBOT_DB_PASSWORD: ${BUILDBOT_DB_PASSWORD:?BUILDBOT_DB_PASSWORD must be set}
      BUILDBOT_FQDN: ${BUILDBOT_FQDN:-http://localhost:8010}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - .:/opt/buildbot-config:ro
      - buildbot-master:/var/lib/buildbot/master
      - buildbot-artifacts:/var/lib/buildbot/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - buildbot-master
    expose:
      - "8010"
      - "9989"

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - master
    ports:
      - "${BUILDBOT_HTTP_PORT:-8010}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - buildbot-artifacts:/srv/artifacts:ro

volumes:
  buildbot-postgres:
  buildbot-master:
  buildbot-artifacts:

networks:
  default:
    name: pycdc-buildbot
